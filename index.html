<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaf5" />
    <script>
      (() => {
        let theme
        try { theme = localStorage.getItem('yasser-portfolio-theme') } catch {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <meta name="description" content="Yasser Salem — Front-End Developer and Technical Instructor. Building thoughtful web experiences and helping developers grow." />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48 64x64" href="/favicon.ico?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=5" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=5" />
    <link rel="preload" as="image" href="/loading-logo.png" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Yasser | Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
